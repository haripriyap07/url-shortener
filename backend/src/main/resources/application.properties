# ===============================
# Server
# ===============================
server.port=${PORT:8081}

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:urldb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Dialect & DDL execution
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# ===============================
# H2 Console (Local Only)
# ===============================
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}

# ===============================
# Redis / Upstash
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# ===============================
# Cache & Async
# ===============================
spring.cache.type=simple
spring.task.execution.pool.core-size=4

# ===============================
# Custom Application Props
# ===============================
app.base-url=${APP_BASE_URL:http://localhost:8081}
